<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>CityBucketList — Eats &amp; Drinks</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0A0A0A; color: #fff;
    font-family: Inter, system-ui, sans-serif; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  @keyframes cbl-pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.45;transform:scale(.85);} }
  @keyframes cbl-reveal { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }

  /* ── Hero band ── */
  .hero {
    position: relative; overflow: hidden;
    background:
      linear-gradient(180deg, rgba(10,10,10,.25) 0%, rgba(10,10,10,.55) 45%, rgba(10,10,10,.92) 90%, #0A0A0A 100%),
      url('assets/imagery/cbl-map-backdrop.jpg') center top / cover no-repeat;
    padding: 48px 48px 56px;
  }
  .hero-inner {
    max-width: 1280px; margin: 0 auto;
    display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; align-items: start;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: .14em; color: #8a8a8a; text-transform: lowercase;
    margin-bottom: 18px;
  }
  .eyebrow::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: #C99742; animation: cbl-pulse 2.4s ease-in-out infinite;
  }
  h1.hero-title {
    font-family: 'Barlow Condensed','Myriad Pro',sans-serif;
    font-weight: 900; font-size: clamp(64px, 7.4vw, 108px);
    line-height: .9; letter-spacing: -.02em; text-transform: uppercase;
    display: flex; align-items: center; gap: 28px; flex-wrap: nowrap;
  }
  h1.hero-title .eats { color: #fff; white-space: nowrap; }
  .hero-subtitle {
    margin-top: 14px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: clamp(28px, 3vw, 44px);
    text-transform: uppercase; letter-spacing: -.005em; line-height: 1;
    color: #C99742;
  }
  .hero-subtitle .it {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-weight: 600; color: #C99742; text-transform: none;
    letter-spacing: 0; font-size: .82em;
  }
  .hero-title-row {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start;
  }
  h1.hero-title .fork-knife {
    flex-shrink: 0; width: 110px; height: 130px;
    background: url('assets/food-icons/eats-drinks-knife-fork.svg') center/contain no-repeat;
    opacity: .92;
  }
  @media (max-width: 1100px) {
    h1.hero-title .fork-knife { width: 88px; height: 100px; }
  }
  @media (max-width: 720px) {
    h1.hero-title .fork-knife { width: 64px; height: 72px; }
  }
  .hero p.lede {
    margin-top: 22px; max-width: 520px; font-size: 17px;
    line-height: 1.6; color: #B8B8B8;
  }

  .hero-feature {
    position: relative; aspect-ratio: 4/3; border-radius: 24px 0 24px 0;
    overflow: hidden; max-height: 360px;
    border: 1px solid rgba(255,255,255,.06);
  }
  .hero-feature .ph {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0) 30%, rgba(10,10,10,.85)),
      url('assets/imagery/sq-plate.jpg') center/cover no-repeat;
  }
  .hero-feature .meta {
    position: absolute; left: 22px; right: 22px; bottom: 22px;
  }
  .hero-feature .sponsored {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: .18em; color: #C99742;
    background: rgba(0,0,0,.55); padding: 6px 10px;
    border: 1px solid rgba(201,151,66,.4);
    display: inline-block; margin-bottom: 10px;
  }
  .hero-feature h3 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 36px; letter-spacing: -.01em; line-height: 1;
    text-transform: uppercase;
  }
  .hero-feature .hours {
    color: #C99742; font-size: 12px; letter-spacing: .08em;
    margin-top: 6px; text-transform: uppercase; font-weight: 700;
  }

  /* ── Filter rail ── */
  .filters {
    position: sticky; top: 68px; z-index: 20;
    background: rgba(10,10,10,.93); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.06);
    padding: 22px 48px 0;
  }
  .filters-inner { max-width: 1280px; margin: 0 auto; }
  .meal-row {
    display: flex; gap: 6px; padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .meal-btn {
    background: transparent; border: 0; color: #888;
    padding: 10px 22px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 17px; letter-spacing: .14em; text-transform: uppercase;
    transition: color .2s;
    border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .meal-btn svg { opacity: .55; transition: opacity .2s; }
  .meal-btn:hover { color: #fff; }
  .meal-btn:hover svg { opacity: .9; }
  .meal-btn.active { color: #C99742; border-bottom-color: #C99742; }
  .meal-btn.active svg { opacity: 1; stroke: #C99742; }
  .meal-btn.active svg * { stroke: #C99742; }

  .cuisine-row {
    display: flex; gap: 8px; padding: 18px 0;
    overflow-x: auto; scrollbar-width: thin;
    scrollbar-color: rgba(201,151,66,.4) transparent;
  }
  .cuisine-row::-webkit-scrollbar { height: 6px; }
  .cuisine-row::-webkit-scrollbar-thumb { background: rgba(201,151,66,.35); border-radius: 3px; }
  .cuisine-chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: 999px;
    background: transparent; border: 1px solid rgba(255,255,255,.10);
    color: #C99742; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 13px; letter-spacing: .12em;
    text-transform: uppercase; transition: all .2s;
  }
  .cuisine-chip svg { width: 26px; height: 26px; }
  .cuisine-chip:hover { border-color: rgba(201,151,66,.45); color: #fff; transform: translateY(-1px); }
  .cuisine-chip.active {
    background: rgba(201,151,66,.15); border-color: #C99742; color: #fff;
  }
  .cuisine-chip.all { padding: 10px 20px; }

  /* ── Results section ── */
  .results {
    max-width: 1280px; margin: 0 auto; padding: 48px 48px 96px;
  }
  .results-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 32px; gap: 24px;
  }
  .results-head h2 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 52px; line-height: 1; letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .results-head h2 .it {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-weight: 600; color: #C99742; text-transform: none;
    font-size: .7em; margin-left: 8px;
  }
  .results-head .count {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: .14em; color: #8a8a8a; text-transform: uppercase;
  }
  .results-head .count b { color: #C99742; }

  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  }
  .grid .sponsored-card { grid-column: span 3; }

  .card {
    background: #141414; border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px 0 18px 0; overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .35s, border-color .35s;
    animation: cbl-reveal .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(201,151,66,.4); }
  .card .img {
    aspect-ratio: 5/3.4;
    background-size: cover; background-position: center;
    background-repeat: no-repeat; position: relative;
  }
  .card .img::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0) 40%, rgba(10,10,10,.55));
  }
  .card .tags {
    position: absolute; top: 14px; left: 14px; display: flex; gap: 6px;
  }
  .card .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: .14em; text-transform: uppercase; color: #C99742;
    background: rgba(0,0,0,.6); padding: 5px 10px;
    border: 1px solid rgba(201,151,66,.4); backdrop-filter: blur(6px);
  }
  .card .body { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card h3 {
    margin: 0; font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -.005em;
    text-transform: uppercase;
  }
  .card .address {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: #C99742; letter-spacing: .08em; text-transform: uppercase;
  }
  .card .desc { font-size: 14px; line-height: 1.55; color: #B0B0B0; }
  .card .meta {
    display: flex; align-items: center; gap: 12px;
    padding-top: 4px; margin-top: auto;
  }
  .card .rating { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .card .rating b { color: #fff; font-weight: 700; }
  .card .rating span.r { color: #888; font-size: 12px; }
  .card .dot { width: 3px; height: 3px; border-radius: 50%; background: #444; }
  .card .price { color: #C99742; font-weight: 700; font-size: 13px; }
  .card .open {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: #8CC084; border: 1px solid rgba(140,192,132,.35);
    padding: 3px 8px; letter-spacing: .1em; text-transform: uppercase;
  }
  .card .cta-row { display: flex; gap: 10px; margin-top: 14px; }
  .card .cta {
    flex: 1; background: #C99742; border: 0; color: #fff;
    padding: 12px 0; border-radius: 999px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    transition: background .2s;
  }
  .card .cta:hover { background: #B0831A; }
  .card .cta.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.18); }
  .card .cta.ghost:hover { border-color: #C99742; color: #C99742; background: transparent; }

  /* Sponsored spotlight */
  .spotlight {
    display: grid; grid-template-columns: 1.1fr 1fr;
    background: linear-gradient(135deg, #141414, #0c0c0c);
    border: 1px solid rgba(201,151,66,.25);
    border-radius: 24px 0 24px 0; overflow: hidden;
  }
  .spotlight .shot { min-height: 360px;
    background: url('assets/imagery/sq-plate.jpg') center/cover no-repeat; }
  .spotlight .text { padding: 40px 44px 36px; display: flex; flex-direction: column; gap: 18px; }
  .spotlight .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: #C99742; letter-spacing: .18em; text-transform: uppercase;
  }
  .spotlight .kicker::before {
    content: ''; width: 22px; height: 1px; background: #C99742;
  }
  .spotlight h3 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 56px; line-height: .95; letter-spacing: -.01em; text-transform: uppercase;
  }
  .spotlight h3 .it {
    font-family: 'Playfair Display', serif; font-style: italic;
    color: #C99742; font-weight: 600; text-transform: none;
    font-size: .55em; display: block; margin-top: 4px;
  }
  .spotlight p { color: #B8B8B8; font-size: 15px; line-height: 1.65; max-width: 52ch; }
  .spotlight .row { display: flex; align-items: center; gap: 18px; margin-top: 4px; }
  .spotlight .row .addr { color: #888; font-size: 13px; }
  .spotlight .actions { display: flex; gap: 12px; margin-top: 8px; }

  /* Empty state */
  .empty {
    grid-column: span 3;
    padding: 72px 24px; text-align: center;
    border: 1px dashed rgba(255,255,255,.14);
    border-radius: 18px 0 18px 0;
  }
  .empty h4 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 32px; text-transform: uppercase; letter-spacing: -.01em;
    margin-bottom: 6px;
  }
  .empty h4 .it {
    font-family: 'Playfair Display', serif; font-style: italic;
    color: #C99742; font-weight: 600; text-transform: none;
  }
  .empty p { color: #888; font-size: 14px; }

  /* Footer is provided by CBLFooter */
  footer { margin-top: 40px; }

  /* Tablet */
  @media (max-width: 1100px) {
    .hero-inner { grid-template-columns: 1fr; gap: 40px; }
    .hero-feature { aspect-ratio: 16/9; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .grid .sponsored-card { grid-column: span 2; }
    .spotlight { grid-template-columns: 1fr; }
    .spotlight .shot { aspect-ratio: 16/9; min-height: 0; }
    .empty { grid-column: span 2; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="lib/primitives.jsx"></script>
<script type="text/babel" src="lib/cuisine-icons.jsx"></script>
<script type="text/babel" src="lib/data.jsx"></script>
<script type="text/babel" src="lib/cbl-web-components.jsx"></script>

<script type="text/babel">
const DESKTOP_MEALS = [
  { key: 'ALL',        icon: null },
  { key: 'BREAKFAST',  icon: MealIcons.BREAKFAST },
  { key: 'LUNCH',      icon: MealIcons.LUNCH },
  { key: 'DINNER',     icon: MealIcons.DINNER },
  { key: 'DESSERT',    icon: MealIcons.DESSERT },
];
const DESKTOP_CUISINES = [
  'ALL','TACOS','PIZZA','CHINESE','VEGETARIAN',
  'SUSHI','THAI','AMERICAN','SEAFOOD',
  'BURGERS','ITALIAN','COFFEE','SANDWICHES',
  'KOREAN','JAPANESE','VIETNAMESE','INDIAN','MEXICAN',
];

function BucketGlyph({ value = 5, size = 14 }) {
  return (
    <span style={{ display:'inline-flex', gap:2 }}>
      {Array.from({ length: 5 }).map((_, i) => (
        <svg key={i} width={size} height={size} viewBox="0 0 20 20"
          style={{ opacity: i < value ? 1 : .25 }}>
          <path d="M4 6h12l-1.5 10a1.5 1.5 0 0 1-1.5 1.3H7a1.5 1.5 0 0 1-1.5-1.3L4 6z"
            fill="#C99742" stroke="#C99742" strokeWidth="1" />
          <path d="M3 5.5h14" stroke="#C99742" strokeWidth="1.6" strokeLinecap="round" fill="none"/>
        </svg>
      ))}
    </span>
  );
}

function RestaurantCard({ r }) {
  return (
    <article className="card">
      <div className="img" style={{ backgroundImage: `url(${r.image})` }}>
        <div className="tags">
          {r.cuisine.slice(0,2).map(c => <span key={c} className="tag">{c}</span>)}
        </div>
      </div>
      <div className="body">
        <h3>{r.name}</h3>
        <div className="address">{r.address}</div>
        <p className="desc">{r.description}</p>
        <div className="meta">
          <div className="rating">
            <BucketGlyph value={Math.round(r.rating)} />
            <b>{r.rating.toFixed(1)}</b>
            <span className="r">({r.reviews.toLocaleString()})</span>
          </div>
          <span className="dot" />
          <span className="price">{r.price}</span>
          <span className="dot" />
          <span className="open">Open Now</span>
        </div>
        <div className="cta-row">
          <button className="cta">More Info</button>
          <button className="cta ghost">View on Map</button>
        </div>
      </div>
    </article>
  );
}

function Spotlight({ r }) {
  return (
    <div className="card sponsored-card" style={{ padding: 0, overflow: 'hidden' }}>
      <div className="spotlight" style={{ border: 0, borderRadius: 0 }}>
        <div className="shot" style={{ backgroundImage: `url(${r.image})` }} />
        <div className="text">
          <div className="kicker">CBL Sponsored · East Liberty pick</div>
          <h3>{r.name}
            <span className="it">a local morning room</span>
          </h3>
          <p>{r.description}</p>
          <div className="row">
            <BucketGlyph value={5} size={18} />
            <span style={{ color:'#fff', fontWeight:700 }}>{r.rating.toFixed(1)}</span>
            <span className="addr">· {r.reviews.toLocaleString()} reviews</span>
            <span className="dot" />
            <span className="addr">{r.address}</span>
          </div>
          <div className="actions">
            <button className="cta" style={{ padding:'14px 28px', flex:'0 0 auto' }}>Reserve a Table</button>
            <button className="cta ghost" style={{ padding:'14px 28px', flex:'0 0 auto' }}>View Menu</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function DesktopEats() {
  const [meal, setMeal] = React.useState('LUNCH');
  const [cuisine, setCuisine] = React.useState('ALL');

  const filtered = RESTAURANTS.filter(r =>
    (meal === 'ALL' || r.meal.includes(meal)) &&
    (cuisine === 'ALL' || r.cuisine.includes(cuisine))
  );
  const featured = filtered.find(r => r.sponsored)
    || RESTAURANTS.find(r => r.sponsored);
  const rest = filtered.filter(r => !r.sponsored);

  return (
    <>
      <CBLNav active="EATS" />

      {/* HERO */}
      <section className="hero">
        <div className="hero-inner">
          <div>
            <div className="eyebrow">what’s on your list tonight?</div>
            <div className="hero-title-row">
              <h1 className="hero-title">
                <span className="eats">Eats &amp; Drinks</span>
                <span className="fork-knife" aria-hidden="true" />
              </h1>
              <div className="hero-subtitle">
                <span>Restaurants</span>
                <span className="it">picked by Pittsburgh</span>
              </div>
            </div>
            <p className="lede">
              Real picks from the drivers, bartenders and regulars who live here.
              No sponsored lists, no recycled top-tens — just the rooms, plates
              and bar stools our team keeps coming back to.
            </p>
          </div>
          <div className="hero-feature">
            <div className="ph" />
            <div className="meta">
              <span className="sponsored">CBL Featured · Brunch</span>
              <h3>Square Cafe</h3>
              <div className="hours">134 S Highland Ave · Open till 3pm</div>
            </div>
          </div>
        </div>
      </section>

      {/* FILTERS */}
      <div className="filters">
        <div className="filters-inner">
          <div className="meal-row">
            {DESKTOP_MEALS.map(m => (
              <button key={m.key}
                className={'meal-btn' + (meal === m.key ? ' active' : '')}
                onClick={() => setMeal(m.key)}
              >
                <span style={{ height: 56, display:'flex', alignItems:'center', justifyContent:'center' }}>
                  {m.icon || <span style={{
                    width:26, height:26, borderRadius:'50%',
                    border:'1.6px solid currentColor', display:'flex',
                    alignItems:'center', justifyContent:'center',
                    fontSize:12, fontWeight:700,
                  }}>◷</span>}
                </span>
                {m.key === 'ALL' ? 'All Day' : m.key}
              </button>
            ))}
          </div>
          <div className="cuisine-row">
            {DESKTOP_CUISINES.map(c => {
              const active = cuisine === c;
              const icon = CuisineIcons[c];
              return (
                <button key={c}
                  className={'cuisine-chip' + (active ? ' active' : '') + (c === 'ALL' ? ' all' : '')}
                  onClick={() => setCuisine(c)}
                >
                  {c !== 'ALL' && icon && (
                    <span style={{ transform:'scale(.6)', margin:'-6px -8px -6px -4px', display:'inline-flex' }}>
                      {icon}
                    </span>
                  )}
                  {c === 'VIETNAMESE' ? 'Vietnam' : (c.charAt(0) + c.slice(1).toLowerCase())}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {/* RESULTS */}
      <section className="results">
        <div className="results-head">
          <h2>
            {cuisine === 'ALL' ? 'All restaurants' : cuisine.charAt(0) + cuisine.slice(1).toLowerCase()}
            <span className="it">for {meal === 'ALL' ? 'any time' : meal.toLowerCase()}</span>
          </h2>
          <div className="count">
            <b>{filtered.length}</b> places · Pittsburgh
          </div>
        </div>

        <div className="grid">
          {featured && filtered.includes(featured) && <Spotlight r={featured} />}
          {rest.length > 0
            ? rest.map(r => <RestaurantCard key={r.id} r={r} />)
            : (!featured || !filtered.includes(featured)) && (
              <div className="empty">
                <h4>No {cuisine === 'ALL' ? '' : cuisine.toLowerCase() + ' '}
                  spots <span className="it">for {meal === 'ALL' ? 'any time' : meal.toLowerCase()}</span></h4>
                <p>Our Pittsburgh team is curating picks. Try another cuisine or meal time.</p>
              </div>
            )
          }
        </div>
      </section>

      <CBLFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DesktopEats/>);
</script>
</body></html>
